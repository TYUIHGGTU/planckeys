# 左板（PlanckKeys L）用户配置。
# ZMK 按 board 名加载 <board>.conf，所以本文件（planck_left.conf）才是真正
# 作用于左板的配置；旧的共享 planck.conf 与两个 board 名都不匹配，已删除。

# --- 关闭 ZMK 内建 underglow，改由自研模块独占同一条 WS2812 灯带 ---
# 一条 WS2812 只能有一个驱动者；内建 underglow 与"网页每颗独立 RGB"
# 会争抢同一 SPI 设备，故这里彻底关闭内建 underglow。
CONFIG_ZMK_RGB_UNDERGLOW=n

# --- WS2812 灯带驱动（供自研模块使用；不再依赖 underglow 自动选上）---
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_SPI=y
CONFIG_ZMK_EXT_POWER=y

# --- USB + 网页 LED 控制（Raw HID, usage page 0xFF60）---
# 需要第二个 USB HID 接口，供主机经 SET_REPORT 下发灯效数据。
CONFIG_ZMK_USB=y
CONFIG_RAW_HID=y
CONFIG_USB_HID_DEVICE_COUNT=2

# --- 自研 LED 控制模块（仓库根，见 src/led_control.c）---
CONFIG_PLANCKEYS_LED_CONTROL=y

# --- 电源 / 睡眠 / 其它（原 planck.conf 迁移过来，确保真正生效）---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=4000
