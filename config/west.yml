      url-base: https://github.com/zmkfirmware
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: yangxing
      url-base: https://github.com/yangxing844
    - name: zzeneg  # host <-> keyboard raw HID (0xFF60)，供左板网页控灯
      url-base: https://github.com/zzeneg
  projects:
